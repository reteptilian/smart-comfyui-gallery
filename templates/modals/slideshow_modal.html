<!-- FULLSCREEN SLIDESHOW MODULE -->
<style>
    #slideshow-overlay {
        position: fixed;
        inset: 0;
        z-index: 12000;
        display: none;
        background: #000;
        color: #fff;
        overflow: hidden;
    }

    #slideshow-overlay.visible {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #slideshow-stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 76px 88px 84px;
        box-sizing: border-box;
        touch-action: none;
        overscroll-behavior: contain;
    }

    #slideshow-image {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        opacity: 0;
        transition: opacity 180ms ease;
        transform-origin: center center;
        will-change: transform;
    }

    #slideshow-image.loaded {
        opacity: 1;
    }

    #slideshow-stage.zoomed {
        cursor: grab;
    }

    #slideshow-stage.dragging {
        cursor: grabbing;
    }

    #slideshow-overlay.zoomed .slideshow-nav {
        opacity: 0;
        pointer-events: none;
    }

    #slideshow-loader {
        position: absolute;
        width: 44px;
        height: 44px;
        border: 4px solid rgba(255,255,255,.18);
        border-top-color: var(--primary-color);
        border-radius: 50%;
        animation: slideshow-spin .8s linear infinite;
    }

    @keyframes slideshow-spin {
        to { transform: rotate(360deg); }
    }

    .slideshow-topbar,
    .slideshow-controls {
        position: absolute;
        left: 0;
        right: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 20px;
        background: linear-gradient(to bottom, rgba(0,0,0,.82), rgba(0,0,0,.25));
    }

    .slideshow-topbar {
        top: 0;
        justify-content: space-between;
    }

    .slideshow-controls {
        bottom: 0;
        justify-content: center;
        background: linear-gradient(to top, rgba(0,0,0,.88), rgba(0,0,0,.18));
    }

    #slideshow-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: .95rem;
    }

    #slideshow-counter {
        flex-shrink: 0;
        color: #aaa;
        font-family: monospace;
    }

    .slideshow-btn {
        min-width: 44px;
        height: 42px;
        padding: 0 13px;
        border: 1px solid rgba(255,255,255,.28);
        border-radius: 9px;
        background: rgba(255,255,255,.1);
        color: #fff;
        cursor: pointer;
        font-size: 1rem;
    }

    .slideshow-btn:hover {
        background: rgba(255,255,255,.22);
    }

    .slideshow-btn.active {
        color: var(--primary-color);
        border-color: var(--primary-color);
    }

    .slideshow-nav {
        position: absolute;
        z-index: 3;
        top: 50%;
        transform: translateY(-50%);
        width: 58px;
        height: 72px;
        border: 1px solid rgba(255,255,255,.2);
        border-radius: 12px;
        background: rgba(0,0,0,.48);
        color: white;
        cursor: pointer;
        font-size: 2.4rem;
        transition: opacity 140ms ease;
    }

    #slideshow-prev { left: 18px; }
    #slideshow-next { right: 18px; }

    #slideshow-ui-show {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: 4;
        display: none;
    }

    #slideshow-interval {
        width: 68px;
        height: 38px;
        padding: 0 8px;
        box-sizing: border-box;
        border: 1px solid rgba(255,255,255,.28);
        border-radius: 8px;
        background: #111;
        color: #fff;
        text-align: center;
    }

    .slideshow-timing-label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #bbb;
        font-size: .82rem;
    }

    @media (max-width: 640px) {
        #slideshow-stage { padding: 64px 48px 82px; }
        .slideshow-nav { width: 40px; height: 58px; font-size: 1.8rem; }
        #slideshow-prev { left: 4px; }
        #slideshow-next { right: 4px; }
        .slideshow-topbar { padding: 10px 12px; }
        .slideshow-controls { padding: 10px 8px; gap: 6px; }
        .slideshow-btn { min-width: 40px; padding: 0 9px; }
        .slideshow-timing-label span { display: none; }
    }
</style>

<div id="slideshow-overlay" aria-hidden="true">
    <div class="slideshow-topbar">
        <div id="slideshow-title"></div>
        <div style="display:flex;align-items:center;gap:10px;">
            <span id="slideshow-counter"></span>
            <button class="slideshow-btn" type="button" onclick="closeSlideshow()" title="Close slideshow (Esc)">×</button>
        </div>
    </div>

    <div id="slideshow-stage">
        <div id="slideshow-loader"></div>
        <img id="slideshow-image" alt="">
    </div>

    <button id="slideshow-prev" class="slideshow-nav" type="button" onclick="slideshowNavigate(-1)" title="Previous image">‹</button>
    <button id="slideshow-next" class="slideshow-nav" type="button" onclick="slideshowNavigate(1)" title="Next image">›</button>

    <div class="slideshow-controls">
        <button id="slideshow-play" class="slideshow-btn" type="button" onclick="toggleSlideshowPlayback()" title="Play slideshow">▶</button>
        <label class="slideshow-timing-label">
            <span>Advance every</span>
            <input id="slideshow-interval" type="number" min="1" max="120" step="1" value="5" onchange="updateSlideshowInterval()">
            <span>seconds</span>
        </label>
        <button id="slideshow-zoom-reset" class="slideshow-btn" type="button" onclick="resetSlideshowZoom(true)" title="Reset zoom (0)" style="display:none;">↺ 100%</button>
        <button class="slideshow-btn" type="button" onclick="toggleSlideshowInfo()" title="Show or hide filename and controls">👁</button>
    </div>
    <button id="slideshow-ui-show" class="slideshow-btn" type="button" onclick="toggleSlideshowInfo()" title="Show slideshow controls">👁</button>
</div>

<script>
    let slideshowItems = [];
    let slideshowIndex = 0;
    let slideshowTimer = null;
    let slideshowPlaying = false;
    let slideshowLoadToken = 0;
    let slideshowUiVisible = true;
    let slideshowZoom = 1;
    let slideshowTranslateX = 0;
    let slideshowTranslateY = 0;
    const slideshowPointers = new Map();
    let slideshowGesture = null;
    let slideshowGestureHadPinch = false;
    let slideshowLastTap = null;
    let slideshowIgnoreDblClickUntil = 0;

    const SLIDESHOW_MIN_ZOOM = 1;
    const SLIDESHOW_MAX_ZOOM = 10;
    const SLIDESHOW_SWIPE_DISTANCE = 60;
    const SLIDESHOW_SWIPE_DURATION = 700;

    function slideshowIsOpen() {
        return document.getElementById('slideshow-overlay').classList.contains('visible');
    }

    async function openSlideshow() {
        const overlay = document.getElementById('slideshow-overlay');
        slideshowUiVisible = true;
        overlay.querySelector('.slideshow-topbar').style.display = 'flex';
        overlay.querySelector('.slideshow-controls').style.display = 'flex';
        document.getElementById('slideshow-ui-show').style.display = 'none';
        resetSlideshowZoom();
        overlay.classList.add('visible');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.classList.add('modal-open');

        const interval = parseInt(localStorage.getItem('sg_slideshow_interval') || '5', 10);
        document.getElementById('slideshow-interval').value = Math.min(120, Math.max(1, interval || 5));

        if (overlay.requestFullscreen && !document.fullscreenElement) {
            try {
                await overlay.requestFullscreen();
            } catch (error) {
                // Fullscreen can be blocked by browser policy; the fixed overlay remains usable.
            }
        }

        document.getElementById('slideshow-title').textContent = 'Loading current gallery view…';
        document.getElementById('slideshow-counter').textContent = '';
        document.getElementById('slideshow-image').classList.remove('loaded');
        document.getElementById('slideshow-loader').style.display = 'block';

        try {
            const response = await fetch('/galleryout/api/current_view_slideshow');
            const data = await response.json();
            if (!response.ok || data.status !== 'success') {
                throw new Error(data.message || 'Unable to load slideshow.');
            }
            slideshowItems = data.items || [];
            if (!slideshowItems.length) {
                closeSlideshow();
                if (typeof showNotification === 'function') {
                    showNotification('No images are available in the current filtered view.', 'info');
                }
                return;
            }

            const currentId = window.currentLightboxFile && window.currentLightboxFile.id;
            const currentIndex = currentId
                ? slideshowItems.findIndex(item => item.id === currentId)
                : -1;
            slideshowIndex = currentIndex >= 0 ? currentIndex : 0;
            slideshowPlaying = false;
            updateSlideshowPlayButton();
            showSlideshowItem();
        } catch (error) {
            closeSlideshow();
            if (typeof showNotification === 'function') {
                showNotification(error.message || 'Unable to start slideshow.', 'error');
            }
        }
    }

    function closeSlideshow() {
        stopSlideshowTimer();
        slideshowPlaying = false;
        slideshowItems = [];
        resetSlideshowZoom();
        slideshowPointers.clear();
        slideshowGesture = null;
        const overlay = document.getElementById('slideshow-overlay');
        overlay.classList.remove('visible');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('modal-open');
        document.getElementById('slideshow-image').removeAttribute('src');
        if (document.fullscreenElement === overlay && document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
        }
    }

    function showSlideshowItem(failedAttempts = 0) {
        if (!slideshowItems.length || !slideshowIsOpen()) return;
        const item = slideshowItems[slideshowIndex];
        const image = document.getElementById('slideshow-image');
        const loader = document.getElementById('slideshow-loader');
        const token = ++slideshowLoadToken;

        resetSlideshowZoom();
        image.classList.remove('loaded');
        loader.style.display = 'block';
        document.getElementById('slideshow-title').textContent = item.name || 'Untitled';
        document.getElementById('slideshow-counter').textContent = `${slideshowIndex + 1} / ${slideshowItems.length}`;

        image.onload = () => {
            if (token !== slideshowLoadToken) return;
            loader.style.display = 'none';
            image.classList.add('loaded');
            scheduleSlideshowAdvance();
        };
        image.onerror = () => {
            if (token !== slideshowLoadToken) return;
            if (failedAttempts + 1 >= slideshowItems.length) {
                loader.style.display = 'none';
                document.getElementById('slideshow-title').textContent = 'No slideshow images could be loaded.';
                stopSlideshowTimer();
                slideshowPlaying = false;
                updateSlideshowPlayButton();
                return;
            }
            slideshowIndex = (slideshowIndex + 1) % slideshowItems.length;
            showSlideshowItem(failedAttempts + 1);
        };
        image.alt = item.name || '';
        image.src = `/galleryout/file/${item.id}`;
    }

    function slideshowNavigate(direction) {
        if (!slideshowItems.length) return;
        stopSlideshowTimer();
        slideshowIndex = (slideshowIndex + direction + slideshowItems.length) % slideshowItems.length;
        showSlideshowItem();
    }

    function getSlideshowStageCenter() {
        const rect = document.getElementById('slideshow-stage').getBoundingClientRect();
        return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    }

    function clampSlideshowPan() {
        const stage = document.getElementById('slideshow-stage');
        const image = document.getElementById('slideshow-image');
        const style = getComputedStyle(stage);
        const availableWidth = stage.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
        const availableHeight = stage.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
        const maxX = Math.max(0, (image.offsetWidth * slideshowZoom - availableWidth) / 2);
        const maxY = Math.max(0, (image.offsetHeight * slideshowZoom - availableHeight) / 2);
        slideshowTranslateX = Math.max(-maxX, Math.min(maxX, slideshowTranslateX));
        slideshowTranslateY = Math.max(-maxY, Math.min(maxY, slideshowTranslateY));
    }

    function updateSlideshowTransform() {
        const image = document.getElementById('slideshow-image');
        const stage = document.getElementById('slideshow-stage');
        const overlay = document.getElementById('slideshow-overlay');
        const resetButton = document.getElementById('slideshow-zoom-reset');
        const isZoomed = slideshowZoom > SLIDESHOW_MIN_ZOOM + 0.001;

        clampSlideshowPan();
        image.style.transform = `translate(${slideshowTranslateX}px, ${slideshowTranslateY}px) scale(${slideshowZoom})`;
        stage.classList.toggle('zoomed', isZoomed);
        overlay.classList.toggle('zoomed', isZoomed);
        resetButton.style.display = isZoomed ? 'block' : 'none';
        resetButton.textContent = `↺ ${Math.round(slideshowZoom * 100)}%`;
    }

    function setSlideshowZoom(nextZoom, focalX, focalY) {
        const previousZoom = slideshowZoom;
        nextZoom = Math.max(SLIDESHOW_MIN_ZOOM, Math.min(SLIDESHOW_MAX_ZOOM, nextZoom));

        if (nextZoom === SLIDESHOW_MIN_ZOOM) {
            slideshowZoom = SLIDESHOW_MIN_ZOOM;
            slideshowTranslateX = 0;
            slideshowTranslateY = 0;
            updateSlideshowTransform();
            return;
        }

        const center = getSlideshowStageCenter();
        const focusX = Number.isFinite(focalX) ? focalX : center.x;
        const focusY = Number.isFinite(focalY) ? focalY : center.y;
        const ratio = nextZoom / previousZoom;
        slideshowTranslateX = focusX - center.x - (focusX - center.x - slideshowTranslateX) * ratio;
        slideshowTranslateY = focusY - center.y - (focusY - center.y - slideshowTranslateY) * ratio;
        slideshowZoom = nextZoom;
        updateSlideshowTransform();
    }

    function resetSlideshowZoom(userInitiated = false) {
        if (userInitiated) stopSlideshowTimer();
        slideshowZoom = SLIDESHOW_MIN_ZOOM;
        slideshowTranslateX = 0;
        slideshowTranslateY = 0;
        const image = document.getElementById('slideshow-image');
        if (image) updateSlideshowTransform();
        if (userInitiated) scheduleSlideshowAdvance();
    }

    function slideshowPointerDistance(points) {
        return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
    }

    function slideshowPointerMidpoint(points) {
        return {
            x: (points[0].x + points[1].x) / 2,
            y: (points[0].y + points[1].y) / 2,
        };
    }

    function beginSlideshowSinglePointer(pointer, hadPinch = false) {
        slideshowGesture = {
            startX: pointer.x,
            startY: pointer.y,
            startTime: performance.now(),
            panX: slideshowTranslateX,
            panY: slideshowTranslateY,
        };
        slideshowGestureHadPinch = hadPinch;
    }

    function handleSlideshowPointerDown(event) {
        if (!slideshowIsOpen() || (event.pointerType === 'mouse' && event.button !== 0)) return;
        const stage = document.getElementById('slideshow-stage');
        stage.setPointerCapture(event.pointerId);
        slideshowPointers.set(event.pointerId, { x: event.clientX, y: event.clientY, type: event.pointerType });
        stopSlideshowTimer();

        if (slideshowPointers.size === 1) {
            beginSlideshowSinglePointer(Array.from(slideshowPointers.values())[0]);
        } else if (slideshowPointers.size === 2) {
            const points = Array.from(slideshowPointers.values());
            const midpoint = slideshowPointerMidpoint(points);
            const center = getSlideshowStageCenter();
            slideshowGestureHadPinch = true;
            slideshowGesture = {
                pinchDistance: slideshowPointerDistance(points),
                pinchZoom: slideshowZoom,
                contentX: (midpoint.x - center.x - slideshowTranslateX) / slideshowZoom,
                contentY: (midpoint.y - center.y - slideshowTranslateY) / slideshowZoom,
            };
        }
        stage.classList.add('dragging');
    }

    function handleSlideshowPointerMove(event) {
        if (!slideshowPointers.has(event.pointerId)) return;
        event.preventDefault();
        slideshowPointers.set(event.pointerId, { x: event.clientX, y: event.clientY, type: event.pointerType });

        if (slideshowPointers.size >= 2) {
            const points = Array.from(slideshowPointers.values()).slice(0, 2);
            const midpoint = slideshowPointerMidpoint(points);
            const center = getSlideshowStageCenter();
            const nextZoom = Math.max(
                SLIDESHOW_MIN_ZOOM,
                Math.min(SLIDESHOW_MAX_ZOOM, slideshowGesture.pinchZoom * slideshowPointerDistance(points) / slideshowGesture.pinchDistance)
            );
            slideshowZoom = nextZoom;
            slideshowTranslateX = midpoint.x - center.x - slideshowGesture.contentX * nextZoom;
            slideshowTranslateY = midpoint.y - center.y - slideshowGesture.contentY * nextZoom;
            if (nextZoom === SLIDESHOW_MIN_ZOOM) {
                slideshowTranslateX = 0;
                slideshowTranslateY = 0;
            }
            updateSlideshowTransform();
        } else if (slideshowZoom > SLIDESHOW_MIN_ZOOM && slideshowGesture) {
            slideshowTranslateX = slideshowGesture.panX + event.clientX - slideshowGesture.startX;
            slideshowTranslateY = slideshowGesture.panY + event.clientY - slideshowGesture.startY;
            updateSlideshowTransform();
        }
    }

    function finishSlideshowPointer(event, cancelled = false) {
        if (!slideshowPointers.has(event.pointerId)) return;
        const previousPointer = slideshowPointers.get(event.pointerId);
        const endingPointer = { x: event.clientX, y: event.clientY, type: previousPointer.type };
        slideshowPointers.delete(event.pointerId);

        if (slideshowPointers.size === 1 && slideshowGestureHadPinch) {
            beginSlideshowSinglePointer(Array.from(slideshowPointers.values())[0], true);
            return;
        }

        if (slideshowPointers.size > 0) return;
        document.getElementById('slideshow-stage').classList.remove('dragging');

        let navigated = false;
        if (!cancelled && slideshowGesture && !slideshowGestureHadPinch) {
            const dx = endingPointer.x - slideshowGesture.startX;
            const dy = endingPointer.y - slideshowGesture.startY;
            const duration = performance.now() - slideshowGesture.startTime;
            if (slideshowZoom === SLIDESHOW_MIN_ZOOM && duration <= SLIDESHOW_SWIPE_DURATION && Math.abs(dx) >= SLIDESHOW_SWIPE_DISTANCE && Math.abs(dx) > Math.abs(dy) * 1.25) {
                slideshowNavigate(dx < 0 ? 1 : -1);
                navigated = true;
            } else if (Math.hypot(dx, dy) < 12 && endingPointer.type === 'touch') {
                const now = performance.now();
                if (slideshowLastTap && now - slideshowLastTap.time < 320 && Math.hypot(endingPointer.x - slideshowLastTap.x, endingPointer.y - slideshowLastTap.y) < 32) {
                    if (slideshowZoom > SLIDESHOW_MIN_ZOOM) {
                        resetSlideshowZoom();
                    } else {
                        setSlideshowZoom(2.5, endingPointer.x, endingPointer.y);
                    }
                    slideshowIgnoreDblClickUntil = performance.now() + 500;
                    slideshowLastTap = null;
                } else {
                    slideshowLastTap = { time: now, x: endingPointer.x, y: endingPointer.y };
                }
            }
        }

        slideshowGesture = null;
        slideshowGestureHadPinch = false;
        if (!navigated) scheduleSlideshowAdvance();
    }

    const slideshowStage = document.getElementById('slideshow-stage');
    slideshowStage.addEventListener('pointerdown', handleSlideshowPointerDown);
    slideshowStage.addEventListener('pointermove', handleSlideshowPointerMove, { passive: false });
    slideshowStage.addEventListener('pointerup', event => finishSlideshowPointer(event));
    slideshowStage.addEventListener('pointercancel', event => finishSlideshowPointer(event, true));
    slideshowStage.addEventListener('wheel', event => {
        if (!slideshowIsOpen()) return;
        event.preventDefault();
        stopSlideshowTimer();
        const factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
        setSlideshowZoom(slideshowZoom * factor, event.clientX, event.clientY);
        scheduleSlideshowAdvance();
    }, { passive: false });
    slideshowStage.addEventListener('dblclick', event => {
        event.preventDefault();
        if (performance.now() < slideshowIgnoreDblClickUntil) return;
        stopSlideshowTimer();
        if (slideshowZoom > SLIDESHOW_MIN_ZOOM) {
            resetSlideshowZoom();
        } else {
            setSlideshowZoom(2.5, event.clientX, event.clientY);
        }
        scheduleSlideshowAdvance();
    });
    window.addEventListener('resize', () => {
        if (slideshowIsOpen()) updateSlideshowTransform();
    });

    function toggleSlideshowPlayback() {
        slideshowPlaying = !slideshowPlaying;
        updateSlideshowPlayButton();
        if (slideshowPlaying) {
            scheduleSlideshowAdvance();
        } else {
            stopSlideshowTimer();
        }
    }

    function updateSlideshowPlayButton() {
        const button = document.getElementById('slideshow-play');
        button.textContent = slideshowPlaying ? '❚❚' : '▶';
        button.title = slideshowPlaying ? 'Pause slideshow' : 'Play slideshow';
        button.classList.toggle('active', slideshowPlaying);
    }

    function updateSlideshowInterval() {
        const input = document.getElementById('slideshow-interval');
        const value = Math.min(120, Math.max(1, parseInt(input.value, 10) || 5));
        input.value = value;
        localStorage.setItem('sg_slideshow_interval', String(value));
        if (slideshowPlaying) scheduleSlideshowAdvance();
    }

    function scheduleSlideshowAdvance() {
        stopSlideshowTimer();
        if (!slideshowPlaying || !slideshowIsOpen()) return;
        const seconds = Math.min(
            120,
            Math.max(1, parseInt(document.getElementById('slideshow-interval').value, 10) || 5)
        );
        slideshowTimer = window.setTimeout(() => slideshowNavigate(1), seconds * 1000);
    }

    function stopSlideshowTimer() {
        if (slideshowTimer) {
            clearTimeout(slideshowTimer);
            slideshowTimer = null;
        }
    }

    function toggleSlideshowInfo() {
        slideshowUiVisible = !slideshowUiVisible;
        document.querySelector('#slideshow-overlay .slideshow-topbar').style.display = slideshowUiVisible ? 'flex' : 'none';
        document.querySelector('#slideshow-overlay .slideshow-controls').style.display = slideshowUiVisible ? 'flex' : 'none';
        document.getElementById('slideshow-ui-show').style.display = slideshowUiVisible ? 'none' : 'block';
    }

    document.addEventListener('keydown', event => {
        if (!slideshowIsOpen()) return;
        if (event.key === 'ArrowLeft') {
            event.preventDefault();
            event.stopImmediatePropagation();
            if (slideshowZoom > SLIDESHOW_MIN_ZOOM) return;
            slideshowNavigate(-1);
        } else if (event.key === 'ArrowRight') {
            event.preventDefault();
            event.stopImmediatePropagation();
            if (slideshowZoom > SLIDESHOW_MIN_ZOOM) return;
            slideshowNavigate(1);
        } else if (event.key === '+' || event.key === '=') {
            event.preventDefault();
            event.stopImmediatePropagation();
            stopSlideshowTimer();
            setSlideshowZoom(slideshowZoom * 1.2);
            scheduleSlideshowAdvance();
        } else if (event.key === '-' || event.key === '_') {
            event.preventDefault();
            event.stopImmediatePropagation();
            stopSlideshowTimer();
            setSlideshowZoom(slideshowZoom / 1.2);
            scheduleSlideshowAdvance();
        } else if (event.key === '0') {
            event.preventDefault();
            event.stopImmediatePropagation();
            resetSlideshowZoom(true);
        } else if (event.key === ' ' || event.code === 'Space') {
            event.preventDefault();
            event.stopImmediatePropagation();
            toggleSlideshowPlayback();
        } else if (event.key === 'h' || event.key === 'H') {
            event.preventDefault();
            event.stopImmediatePropagation();
            toggleSlideshowInfo();
        } else if (event.key === 'Escape' && !document.fullscreenElement) {
            event.preventDefault();
            event.stopImmediatePropagation();
            closeSlideshow();
        }
    }, true);

    document.addEventListener('fullscreenchange', () => {
        if (slideshowIsOpen() && !document.fullscreenElement) {
            closeSlideshow();
        }
    });
</script>
